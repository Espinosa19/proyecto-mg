<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accede a tu cuenta</title>
    <link rel="stylesheet" href="css/inicio_sesion.css">
</head>
<body style="background: url('img/fondo2.png') no-repeat center center/cover;">

    <main class="login-card">
        <!-- Botón Regresar ubicado dentro del contenedor -->
        <a href="index.html" class="btn-regresar" title="Regresar" aria-label="Regresar">
            <span class="arrow-icon">&#8592;</span>
        </a>

        <!-- Encabezado con Logo y Título -->
        <header class="card-header">
            <img src="img/logo.png" alt="Logo SPASSSIO" class="card-logo">
            <h1>Inicia sesión<br>para continuar</h1>
        </header>

        <!-- Formulario configurado para redireccionar a home.html y deshabilitar autocompletado -->
        <form class="login-form" action="inicio.html" method="GET" autocomplete="off">
            <div class="input-group">
                <input type="email" id="correo" name="correo" placeholder="Correo" autocomplete="off" required>
            </div>

            <!-- Campo Contraseña con ojito dinámico -->
            <div class="input-group password-group">
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar u ocultar contraseña">
                        <!-- SVG Ojo Abierto -->
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- SVG Ojo Tachado -->
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-continuar">Iniciar sesión</button>

            <!-- ¿Olvidaste tu contraseña? ubicado debajo del botón -->
            <div class="forgot-password">
                <a href="recuperar_password.html">¿Olvidaste tu contraseña?</a>
            </div>
        </form>

        <!-- Pie de página alineado en horizontal -->
        <footer class="card-footer">
            <span>¿No tienes cuenta?</span>
            <a href="crear_cuenta.html" class="link-crear-cuenta">Crear cuenta</a>
        </footer>
    </main>

    <!-- Scripts de interacción -->
    <script>
        // Alternar la visibilidad de la contraseña
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const isPassword = password.getAttribute('type') === 'password';
            password.setAttribute('type', isPassword ? 'text' : 'password');
            this.classList.toggle('active', isPassword);
        });

        // Limpieza automática del formulario al cargar o recargar la página
        window.addEventListener('pageshow', function () {
            const form = document.querySelector('.login-form');
            if (form) {
                form.reset();
            }
        });
    </script>

</body>
</html>
