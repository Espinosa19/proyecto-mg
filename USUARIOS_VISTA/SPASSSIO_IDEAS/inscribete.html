<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscríbete | SPASSSIO</title>

<link rel="stylesheet" href="css/inscribete.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<div class="register-box">

<a href="index.html" class="back-btn">
<i class="fas fa-arrow-left"></i>
Regresar
</a>

<h2>Inscríbete</h2>
<p>Completa el formulario para crear tu cuenta</p>

<form>

<div class="form-grid">

<div class="input-group">
<i class="fas fa-user"></i>
<input type="text" placeholder="Nombre" required>
</div>

<div class="input-group">
<i class="fas fa-user"></i>
<input type="text" placeholder="Apellido" required>
</div>

<div class="input-group full">
<i class="fas fa-envelope"></i>
<input type="email" placeholder="Correo electrónico" required>
</div>

<div class="input-group">
<i class="fas fa-lock"></i>
<input type="password" placeholder="Contraseña" required>
</div>

<div class="input-group">
<i class="fas fa-lock"></i>
<input type="password" placeholder="Confirmar contraseña" required>
</div>

<div class="input-group full">
<i class="fas fa-phone"></i>
<input type="tel" placeholder="Teléfono">
</div>

<div class="input-group">
<i class="fas fa-cake-candles"></i>
<input type="number" placeholder="Edad" required>
</div>

<div class="input-group">
<i class="fas fa-venus-mars"></i>
<select required>
<option disabled selected>Tu Sexo</option>
<option>Femenino</option>
<option>Masculino</option>
</select>
</div>

<div class="input-group">
<i class="fas fa-dumbbell"></i>
<select required>
<option disabled selected>Tu nivel</option>
<option>Básico</option>
<option>Intermedio</option>
<option>Avanzado</option>
</select>
</div>

<div class="input-group">
<i class="fas fa-bullseye"></i>
<select required>
<option disabled selected>Principal Objetivo</option>
<option>Perder peso</option>
<option>Ganar músculo</option>
<option>Mantenerme saludable</option>
</select>
</div>

<div class="input-group full">
<i class="fas fa-box"></i>
<select required>
<option disabled selected>Plan Seleccionado</option>
<option>Plan Básico</option>
<option>Plan Premium</option>
<option>Plan Elite</option>
</select>
</div>

</div>

<button type="button" onclick="registrar()" class="register-btn">
Crear cuenta
</button>

</form>

<div class="extra">
¿Ya tienes cuenta?
<a href="login.html">Inicia sesión</a>
</div>

<div class="social-icons">

<a href="#"><i class="fab fa-facebook-f"></i></a>
<a href="#"><i class="fab fa-instagram"></i></a>
<a href="#"><i class="fab fa-x-twitter"></i></a>
<a href="#"><i class="fab fa-tiktok"></i></a>
<a href="#"><i class="fab fa-whatsapp"></i></a>
<a href="#"><i class="fab fa-youtube"></i></a>

</div>

</div>

<script src="js/inscribete.js"></script>

</body>
</html>
